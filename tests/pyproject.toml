[project]
name = "pylate-rs-tests"
version = "0.1.0"
description = "Comparison tests between pylate and pylate-rs"
requires-python = ">=3.9"
dependencies = [
  "pytest>=7.4.0",
  "numpy>=1.26.4",
  "torch>=2.0.0",
  "pylate>=1.2.0"
]

[project.optional-dependencies]
dev = [
  "pytest-cov>=5.0.0"
]

[tool.pytest.ini_options]
testpaths = ["."]
markers = [
  "slow: marks tests as slow (require model downloads)"
]
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::UserWarning"
]
